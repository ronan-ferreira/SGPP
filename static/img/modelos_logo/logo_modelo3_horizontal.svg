<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" fill="none">
  <!-- Ícone Lateral -->
  <g transform="translate(10, 8) scale(0.94)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="m3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E36"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="m3_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="m3_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <!-- Escudo / Brasão Acadêmico Contemporâneo -->
  <path d="M60 10 L102 24 C102 58 84 94 60 110 C36 94 18 58 18 24 Z" fill="url(#m3_bg)"/>
  <path d="M60 13 L99 26 C99 57 82 91 60 106 C38 91 21 57 21 26 Z" stroke="url(#m3_gold)" stroke-width="1.8" fill="none" stroke-opacity="0.6"/>

  <!-- Livro Aberto / Asas de Crescimento -->
  <!-- Asa Esquerda -->
  <path d="M60 68 C52 64 42 62 32 64 V40 C42 38 52 40 60 45 Z" fill="url(#m3_wing)"/>
  <!-- Asa Direita -->
  <path d="M60 68 C68 64 78 62 88 64 V40 C78 38 68 40 60 45 Z" fill="#93C5FD"/>
  <!-- Páginas Intermediárias / Degraus de Ascensão -->
  <path d="M36 71 C44 68 52 67 60 70 C68 67 76 68 84 71" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 78 C48 76 54 75 60 77 C66 75 72 76 80 78" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

  <!-- Estrela-Guia / Bússola Pedagógica de 4 Pontas (Vértice) -->
  <path d="M60 21 L62.8 28.2 L70 31 L62.8 33.8 L60 41 L57.2 33.8 L50 31 L57.2 28.2 Z" fill="url(#m3_gold)"/>
  <circle cx="60" cy="31" r="1.5" fill="#FFFFFF"/>
</svg>
  </g>

  <!-- Textos do Modelo 3 -->
  <g transform="translate(142, 30)">
    <!-- Sigla Principal -->
    <text x="0" y="42" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0B1E36" letter-spacing="-1.2">SGPP</text>
    
    <!-- Tagline de Excelência -->
    <g transform="translate(140, 18)">
      <rect x="0" y="0" width="180" height="25" rx="5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <text x="12" y="17" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#B45309" letter-spacing="0.8">EXCELÊNCIA &amp; FORMAÇÃO</text>
    </g>

    <!-- Subtítulo Institucional Nobre -->
    <text x="0" y="68" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1E293B" letter-spacing="-0.2">Sistema de Gestão e Planejamento Pedagógico</text>
    <text x="0" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">Plataforma Docente para Educação Básica, Técnica e Superior</text>
  </g>
</svg>